[project]
name = "scirssagent"
version = "0.1.0"
description = "Local RSS literature monitor with LLM relevance classification and static reports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "openai>=1.99.0",
  "pydantic>=2.11.0",
  "python-dotenv>=1.0.1",
  "typer>=0.16.0",
]

[project.scripts]
scirssagent = "scirssagent.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scirssagent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
